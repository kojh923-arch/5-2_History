<title>조선·대한 제국 탐험 수첩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#FFF7EA; --paper-2:#FFEFD6; --card:#FFFFFF;
  --ink:#3E2A1E; --ink-soft:#7A5C48; --line:#EBD7BC;
  --tang:#FF8A3D; --tang-d:#D9661A; --tang-bg:#FFE9D9;
  --mint:#3FB987; --mint-d:#23895F; --mint-bg:#E1F6EC;
  --sky:#4E9BE8; --sky-d:#2F74BD; --sky-bg:#E4F0FC;
  --pink:#F2708F; --pink-d:#C94A69; --pink-bg:#FFE6EC;
  --butter:#F5B800; --butter-d:#B88400; --butter-bg:#FFF3C7;
  --ok:#23945E; --ok-bg:#DDF5E8; --no:#D9434A; --no-bg:#FDE3E3;
  --display:"Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body:"Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{
  margin:0; color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.7;
  background-color:var(--paper);
  background-image:radial-gradient(var(--line) 1.2px, transparent 1.3px);
  background-size:22px 22px;
  word-break:keep-all; overflow-wrap:break-word;
}
h1,h2,h3,h4,.disp{font-family:var(--display); font-weight:400; line-height:1.3; text-wrap:balance; margin:0}
p{margin:0}
a{color:inherit}
button{font-family:var(--display); font-size:16px; cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--tang); outline-offset:2px}
img{max-width:100%; display:block}
.wrap{max-width:980px; margin:0 auto; padding-inline:16px}

/* ---------- header ---------- */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:rgba(255,247,234,.94); backdrop-filter:blur(6px); border-bottom:2px dashed var(--line)}
.top .wrap{display:flex; align-items:center; gap:12px; padding-block:10px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:8px; margin-right:auto; background:none; border:0; padding:0; color:var(--ink)}
.brand svg{width:38px; height:44px}
.brand b{font-family:var(--display); font-weight:400; font-size:21px}
.stamps{display:flex; gap:5px; align-items:center}
.stamps span{width:26px; height:26px; border-radius:50%; border:2px dashed #D8BFA0; display:grid; place-items:center; font-family:var(--display); font-size:12px; color:#B09077; transition:.3s}
.stamps span.on{border:2px solid var(--no); color:var(--no); background:#FFF0F0; transform:rotate(-12deg)}
.nav{display:flex; gap:6px; overflow-x:auto; width:100%; padding-bottom:2px; scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto; border:2px solid var(--line); background:var(--card); color:var(--ink-soft); border-radius:999px; padding:4px 14px; font-size:15px}
.nav button[aria-current="true"]{background:var(--ink); border-color:var(--ink); color:#fff}

/* ---------- common ---------- */
main{padding-block:24px 60px}
.screen{display:grid; gap:22px}
.btn{border:0; border-radius:14px; padding:10px 20px; background:var(--tang); color:#fff; box-shadow:0 4px 0 var(--tang-d); transition:transform .1s, box-shadow .1s}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--tang-d)}
.btn.ghost{background:var(--card); color:var(--ink); box-shadow:0 4px 0 var(--line); border:2px solid var(--line)}
.btn.small{padding:6px 14px; font-size:15px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.chip{display:inline-block; font-family:var(--display); font-size:14px; padding:2px 12px; border-radius:999px; background:var(--paper-2); color:var(--ink-soft)}
.panel{background:var(--card); border:2px solid var(--line); border-radius:var(--r); padding:22px}
.muted{color:var(--ink-soft)}
.small{font-size:14px}
mark{background:linear-gradient(transparent 55%, var(--butter-bg) 55%); color:inherit; font-weight:700; padding:0 2px}
.sec-title{display:flex; align-items:center; gap:10px}
.sec-title h2{font-size:26px}
.sec-title .num{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; color:#fff; font-family:var(--display); font-size:20px; flex:0 0 auto}

/* theme per lesson */
[data-c="mint"]{--c:var(--mint); --cd:var(--mint-d); --cb:var(--mint-bg)}
[data-c="sky"]{--c:var(--sky); --cd:var(--sky-d); --cb:var(--sky-bg)}
[data-c="pink"]{--c:var(--pink); --cd:var(--pink-d); --cb:var(--pink-bg)}
[data-c="butter"]{--c:var(--butter); --cd:var(--butter-d); --cb:var(--butter-bg)}
[data-c="tang"]{--c:var(--tang); --cd:var(--tang-d); --cb:var(--tang-bg)}

/* ---------- home ---------- */
.hero{display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center; background:var(--card); border:2px solid var(--line); border-radius:24px; padding:22px; position:relative; overflow:hidden}
.hero .mascot{width:110px}
.bubble{position:relative; background:var(--butter-bg); border-radius:18px; padding:12px 16px; font-size:16px}
.bubble::before{content:""; position:absolute; left:-10px; top:22px; border:10px solid transparent; border-right-color:var(--butter-bg); border-left:0}
.hero h1{font-size:clamp(26px,5vw,38px); margin-block:6px 8px}
.hero .unit{font-family:var(--display); color:var(--tang-d); font-size:16px}
.goals{display:grid; gap:8px; margin-top:12px; padding:0; list-style:none}
.goals li{display:flex; gap:8px; align-items:flex-start; font-size:16px}
.goals li::before{content:""; flex:0 0 18px; height:18px; margin-top:5px; border-radius:6px; border:2px solid var(--mint)}

.timeline{overflow-x:auto; padding-bottom:6px}
.tl{display:grid; grid-template-columns:repeat(6, minmax(130px,1fr)); gap:0; min-width:780px; position:relative; padding-top:14px}
.tl::before{content:""; position:absolute; left:6%; right:6%; top:34px; height:6px; border-radius:3px; background:repeating-linear-gradient(90deg,var(--tang) 0 14px, transparent 14px 22px)}
.tl .ev{text-align:center; display:grid; justify-items:center; gap:6px; padding-inline:4px; position:relative}
.tl .dot{width:44px; height:44px; border-radius:50%; background:var(--card); border:4px solid var(--c); display:grid; place-items:center; font-family:var(--display); color:var(--cd); font-size:15px; z-index:1}
.tl .ev b{font-family:var(--display); font-weight:400; font-size:17px}
.tl .ev small{font-size:13px; color:var(--ink-soft); line-height:1.4}

.courses{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px}
.course{background:var(--card); border:2px solid var(--line); border-radius:var(--r); padding:16px; text-align:left; color:var(--ink); display:grid; gap:6px; align-content:start; position:relative; box-shadow:0 5px 0 var(--cb); transition:transform .15s}
.course:hover{transform:translateY(-3px)}
.course .tag{font-family:var(--display); font-size:13px; color:#fff; background:var(--c); border-radius:999px; padding:1px 10px; justify-self:start}
.course h3{font-size:19px}
.course p{font-family:var(--body); font-size:14px; color:var(--ink-soft); line-height:1.5}
.course .done{position:absolute; right:10px; top:10px; width:44px; height:44px; border-radius:50%; border:2px solid var(--no); color:var(--no); font-family:var(--display); font-size:12px; display:grid; place-items:center; transform:rotate(-14deg); background:#FFF0F0}
.how{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
.how div{background:var(--paper-2); border-radius:14px; padding:12px 14px; font-size:15px}
.how b{font-family:var(--display); font-weight:400; font-size:17px; display:block}
details.teacher{background:var(--card); border:2px dashed var(--line); border-radius:var(--r); padding:14px 18px}
details.teacher summary{font-family:var(--display); font-size:18px; cursor:pointer}
details.teacher table{border-collapse:collapse; width:100%; font-size:15px; margin-top:10px}
details.teacher td,details.teacher th{border:1px solid var(--line); padding:6px 10px; text-align:left; vertical-align:top}
details.teacher th{background:var(--paper-2); font-family:var(--display); font-weight:400}

/* ---------- lesson ---------- */
.lhead{background:var(--cb); border-radius:24px; padding:22px; display:grid; gap:8px}
.lhead .k{font-family:var(--display); color:var(--cd)}
.lhead h1{font-size:clamp(24px,4.4vw,34px)}
.steps{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}
.steps a{font-family:var(--display); text-decoration:none; background:var(--card); border-radius:999px; padding:3px 14px; font-size:15px; color:var(--cd); border:2px solid var(--c)}
.cards{display:grid; gap:18px}
.card{background:var(--card); border:2px solid var(--line); border-radius:var(--r); padding:20px; display:grid; grid-template-columns:1fr; gap:14px}
.card.has-pics{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.card header{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.card h3{font-size:22px}
.card .era{font-family:var(--display); font-size:13px; color:var(--cd); background:var(--cb); padding:2px 10px; border-radius:999px}
.card ul{margin:0; padding-left:1.1em; display:grid; gap:6px}
.card li::marker{color:var(--c)}
.easy{background:var(--paper-2); border-radius:12px; padding:10px 14px; font-size:15px; margin-top:4px}
.easy b{font-family:var(--display); font-weight:400; color:var(--tang-d); margin-right:4px}
.pics{display:grid; gap:14px; align-content:start}
.pics.two{grid-template-columns:1fr 1fr}
figure{margin:0; background:#fff; padding:8px 8px 6px; border-radius:6px; box-shadow:0 2px 0 var(--line), 0 6px 14px rgba(62,42,30,.08); position:relative; transform:rotate(var(--rot,-1deg))}
figure:nth-child(2n){--rot:1.2deg}
figure::before{content:""; position:absolute; top:-9px; left:50%; width:70px; height:20px; transform:translateX(-50%) rotate(-3deg); background:color-mix(in srgb, var(--c, var(--butter)) 45%, transparent); border-radius:2px}
figure button{border:0; padding:0; background:none; display:block; width:100%; cursor:zoom-in}
figure img{width:100%; height:170px; object-fit:cover; border-radius:3px; background:var(--paper-2)}
figure img.contain{object-fit:contain; background:#fff}
figcaption{font-size:13px; line-height:1.45; padding-top:6px; color:var(--ink)}
.law{display:grid; gap:10px}
.law .item{background:var(--paper-2); border-radius:12px; padding:10px 14px; display:grid; gap:4px}
.law .item p{font-weight:700}
.law .item button{justify-self:start; border:0; background:none; color:var(--cd); font-family:var(--display); padding:0; font-size:15px; text-decoration:underline; text-underline-offset:3px}
.law .item .ans{font-size:15px; color:var(--ink)}

/* blanks */
.blank-box{background:var(--card); border:3px solid var(--c); border-radius:24px; padding:22px; display:grid; gap:14px; position:relative}
.blank-box .hd{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.blank-box h2{font-size:24px}
.bl{display:grid; gap:4px; padding:12px 14px; border-radius:14px; background:var(--paper); border:2px solid transparent}
.bl .topic{font-family:var(--display); font-size:13px; color:var(--cd)}
.bl .sent{line-height:2.1}
.bl input{font-family:var(--display); font-size:17px; width:9.5em; max-width:100%; padding:2px 10px; border:0; border-bottom:3px solid var(--c); background:var(--cb); border-radius:8px 8px 0 0; color:var(--ink); text-align:center}
.bl.ok{border-color:var(--ok); background:var(--ok-bg)}
.bl.no{border-color:var(--no); background:var(--no-bg)}
.bl .fb{font-size:14px; min-height:0}
.bl.ok .fb{color:var(--ok)} .bl.no .fb{color:var(--no)}
.bl .hint{font-size:14px; color:var(--ink-soft)}
.score{font-family:var(--display); font-size:20px}
.think{background:var(--cb); border-radius:var(--r); padding:18px; display:grid; gap:10px}
.think h3{font-size:20px}
.think textarea{font-family:var(--body); font-size:16px; width:100%; min-height:90px; border:2px solid var(--line); border-radius:12px; padding:10px; background:#fff; color:var(--ink); resize:vertical}
.think .ex{background:#fff; border-radius:12px; padding:10px 14px; font-size:15px}

/* links */
.links{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px}
.lk{display:grid; gap:2px; text-decoration:none; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px 14px; transition:border-color .15s, transform .15s}
.lk:hover{border-color:var(--c); transform:translateY(-2px)}
.lk .src{font-size:12px; font-family:var(--display); color:var(--cd)}
.lk b{font-family:var(--display); font-weight:400; font-size:17px}
.lk span{font-size:14px; color:var(--ink-soft); line-height:1.5}
.lk::after{content:"새 창으로 열기 ↗"; font-size:12px; color:var(--ink-soft); margin-top:4px}
.stampbar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; background:var(--card); border:2px dashed var(--c); border-radius:var(--r); padding:14px 18px}

/* play */
.game{background:var(--card); border:2px solid var(--line); border-radius:24px; padding:22px; display:grid; gap:14px}
.game h2{font-size:24px}
.pool,.slots{display:flex; flex-wrap:wrap; gap:8px}
.pool button{border:2px solid var(--butter); background:var(--butter-bg); border-radius:12px; padding:8px 14px; color:var(--ink)}
.pool button[disabled]{opacity:.3}
.slots{counter-reset:s; min-height:56px; background:var(--paper); border-radius:14px; padding:10px; align-items:center}
.slots span{counter-increment:s; font-family:var(--display); background:#fff; border:2px solid var(--line); border-radius:12px; padding:6px 12px}
.slots span::before{content:counter(s) ". "; color:var(--tang-d)}
.slots span.ok{border-color:var(--ok); background:var(--ok-bg)} .slots span.no{border-color:var(--no); background:var(--no-bg)}
.slots em{color:var(--ink-soft); font-style:normal; font-size:15px}
.det{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; align-items:center}
.det figure img{height:240px; object-fit:contain; background:#fff}
.opts{display:grid; gap:8px}
.opts button{border:2px solid var(--line); background:var(--card); border-radius:12px; padding:10px; text-align:left; color:var(--ink)}
.opts button.ok{border-color:var(--ok); background:var(--ok-bg)} .opts button.no{border-color:var(--no); background:var(--no-bg)}
.match{display:grid; gap:10px}
.match .m{display:grid; grid-template-columns:130px 1fr auto; gap:10px; align-items:center; background:var(--paper); border-radius:12px; padding:8px 12px; border:2px solid transparent}
.match .m b{font-family:var(--display); font-weight:400; font-size:18px}
.match select{font-family:var(--body); font-size:15px; padding:6px 8px; border-radius:10px; border:2px solid var(--line); background:#fff; color:var(--ink); width:100%}
.match .m.ok{border-color:var(--ok); background:var(--ok-bg)} .match .m.no{border-color:var(--no); background:var(--no-bg)}
.match .mark{font-family:var(--display); width:24px; text-align:center}
.progress{height:10px; background:var(--paper-2); border-radius:6px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--butter); transition:width .3s}

/* final */
.q{background:var(--card); border:2px solid var(--line); border-radius:var(--r); padding:16px 18px; display:grid; gap:10px}
.q h3{font-size:18px; font-family:var(--body); font-weight:700}
.q h3 .n{font-family:var(--display); font-weight:400; color:var(--tang-d); margin-right:6px}
.q label{display:flex; gap:10px; align-items:flex-start; padding:8px 12px; border-radius:10px; border:2px solid var(--paper-2); cursor:pointer; font-size:16px}
.q label:has(input:checked){border-color:var(--tang); background:var(--tang-bg)}
.q input{margin-top:6px; accent-color:var(--tang)}
.q label.right{border-color:var(--ok); background:var(--ok-bg)}
.q label.wrong{border-color:var(--no); background:var(--no-bg)}
.q .exp{font-size:15px; background:var(--paper); border-radius:10px; padding:8px 12px}
.self{display:grid; gap:10px}
.self .s{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; background:var(--paper); border-radius:12px; padding:10px 14px}
.stars{display:flex; gap:4px}
.stars button{border:0; background:none; font-size:26px; line-height:1; color:var(--line); padding:0 2px}
.stars button.on{color:var(--butter)}
.cert{background:#fff; border:3px double var(--tang); border-radius:24px; padding:26px 22px; text-align:center; display:grid; gap:12px; justify-items:center; position:relative; overflow:hidden}
.cert::before,.cert::after{content:""; position:absolute; width:140px; height:140px; border-radius:50%; background:var(--butter-bg); z-index:0}
.cert::before{left:-50px; top:-50px} .cert::after{right:-50px; bottom:-50px; background:var(--mint-bg)}
.cert > *{position:relative; z-index:1}
.cert h2{font-size:30px; color:var(--tang-d)}
.cert input{font-family:var(--display); font-size:22px; text-align:center; border:0; border-bottom:3px dashed var(--tang); background:transparent; width:220px; max-width:100%; color:var(--ink)}
.cert .big-stamps{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.cert .big-stamps span{width:60px; height:60px; border-radius:50%; border:3px solid var(--line); display:grid; place-items:center; font-family:var(--display); font-size:13px; color:var(--line); line-height:1.1}
.cert .big-stamps span.on{border-color:var(--no); color:var(--no); transform:rotate(-10deg); background:#FFF0F0}

.credits{font-size:13px; color:var(--ink-soft)}
.credits summary{font-family:var(--display); font-size:16px; cursor:pointer; color:var(--ink)}
.credits ol{padding-left:1.3em; display:grid; gap:2px; margin:8px 0 0}

/* lightbox */
.lb{position:fixed; inset:0; background:rgba(40,26,18,.82); z-index:50; display:grid; place-items:center; padding:20px}
.lb figure{transform:none; max-width:min(92vw,720px)}
.lb figure::before{display:none}
.lb img{height:auto; max-height:72vh; object-fit:contain}
.lb .x{position:absolute; top:16px; right:16px}

.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:#fff; font-family:var(--display); padding:10px 20px; border-radius:999px; z-index:60; font-size:16px; box-shadow:0 6px 18px rgba(0,0,0,.2)}
@keyframes pop{0%{transform:scale(.3) rotate(-30deg);opacity:0}70%{transform:scale(1.15) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-12deg)}}
.pop{animation:pop .5s ease-out}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.hero .mascot{animation:wob 3s ease-in-out infinite; transform-origin:50% 90%}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

@media (max-width:720px){
  .card.has-pics{grid-template-columns:1fr}
  .det{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr; text-align:left}
  .hero .mascot{width:80px}
  .bubble::before{display:none}
  .match .m{grid-template-columns:1fr auto}
  .match .m select{grid-column:1 / -1; grid-row:2}
  .brand b{font-size:18px}
}
@media (max-width:420px){ .pics.two{grid-template-columns:1fr} }

/* ---- additions for unit 2·3 ---- */
.stampbox{display:flex; align-items:center; gap:8px; background:var(--card); border:2px solid var(--line); border-radius:999px; padding:3px 10px 3px 12px}
.stampbox > b{font-family:var(--display); font-weight:400; font-size:14px; color:var(--ink-soft); white-space:nowrap}
.stamps span{width:auto; min-width:30px; height:26px; border-radius:999px; padding:0 8px; font-size:12px}
.stamps span.on{transform:rotate(-6deg)}
.vids{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px}
.vid{display:grid; grid-template-rows:auto 1fr; align-content:start; text-decoration:none; background:var(--card); border:2px solid var(--line); border-radius:14px; overflow:hidden; transition:transform .15s, border-color .15s; color:var(--ink)}
.vid:hover{transform:translateY(-2px); border-color:var(--c)}
.vid .th{position:relative; aspect-ratio:16/9; overflow:hidden; background:var(--paper-2)}
.vid .th img{width:100%; height:100%; object-fit:cover}
.vid .th span{position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.78); color:#fff; font-size:12px; font-family:var(--display); padding:1px 7px; border-radius:6px}
.vid .th i{position:absolute; left:50%; top:50%; width:42px; height:30px; margin:-15px 0 0 -21px; background:rgba(230,33,23,.92); border-radius:9px}
.vid .th i::after{content:""; position:absolute; left:17px; top:8px; border:7px solid transparent; border-left:11px solid #fff; border-right:0}
.vid .meta{padding:10px 12px 12px; display:grid; gap:2px}
.vid .meta b{font-family:var(--body); font-weight:700; font-size:15px; line-height:1.45}
.vid .meta small{font-size:12px; color:var(--ink-soft)}

const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* parse "text {ans|alt} text" into parts */
function parseSent(s){ const parts=[]; const re=/\{([^}]+)\}/g; let last=0,m; while((m=re.exec(s))){ parts.push({t:s.slice(last,m.index)}); parts.push({a:m[1].split("|")}); last=re.lastIndex; } parts.push({t:s.slice(last)}); parts.forEach((p,i)=>{ if(p.a){ const pr=parts[i-1], nx=parts[i+1]; if(pr&&/\(\s*$/.test(pr.t)&&nx&&/^\s*\)/.test(nx.t)){ pr.t=pr.t.replace(/\(\s*$/,""); nx.t=nx.t.replace(/^\s*\)/,""); } } }); return parts; }
LESSONS.forEach(L=>L.blanks.forEach(b=>{ b.parts=parseSent(b.s); b.ans=b.parts.filter(p=>p.a).map(p=>p.a); }));

    <p class="small muted" style="margin-top:8px">개별 과제, 보충 학습, 결석생 자기주도 학습용으로도 쓸 수 있어요. 기록은 저장되지 않으니 새로 열면 처음부터 시작돼요. 영상은 유튜브로 연결되니 학교 기기에서 유튜브가 열리는지 미리 확인해 주세요.</p>
  </details>

    <p style="margin-top:6px">사진은 위키미디어 공용(Wikimedia Commons)의 자유 이용 자료를 사용했어요. 영상은 각 유튜브 채널로 연결돼요.</p>
    <ol>${D.CREDITS.map(([a,b])=>`<li>${a} — ${b}</li>`).join("")}</ol>
  </details>
  </section>`;

function blankHTML(L,b,i,st){
  let j=-1;
  const sent = b.parts.map(p=>{
    if(p.t!==undefined) return p.t;
    j++; const key=`${i}-${j}`; const r=st.res?st.res[key]:undefined;
    const val = st.reveal? p.a[0] : (st.vals[key]||"");
    const w = Math.max(4, p.a[0].length+2);
    return `( <input id="${L.id}-b${key}" data-bk="${key}" value="${esc(val)}" autocomplete="off" style="width:${w}em" class="${r===undefined?"":(r?"ok":"no")}" aria-label="${b.topic} 빈칸 ${j+1}"> )`;
  }).join("");
  const keys=b.ans.map((_,k)=>`${i}-${k}`);
  let cls="",fb="";
  if(st.res){ const ok=keys.every(k=>st.res[k]); cls=ok?"ok":"no"; fb= ok?"정답이에요!": (st.reveal?`정답: ${b.ans.map(a=>a[0]).join(", ")}`:"다시 생각해 봐요."); }
  const hint = st.hints[i]? `힌트: ${b.ans.map(a=>`<b>${chosung(a[0])}</b>`).join(" / ")}`:"";
  return `<div class="bl ${cls}"><span class="topic">${i+1}. ${b.topic}</span><p class="sent">${sent}</p>
    <div class="row"><button type="button" class="btn ghost small" data-hint="${i}">초성 힌트</button><span class="hint">${hint}</span><span class="fb">${fb}</span></div></div>`;
}

function lessonView(L){
  const st = S.blanks[L.id] || (S.blanks[L.id]={vals:{},res:null,hints:{},reveal:false});
  const cards = L.cards.map(c=>{
    const pics = c.pics&&c.pics.length ? `<div class="pics ${c.pics.length===2?"two":""}">${c.pics.map(fig).join("")}</div>`:"";
    const grid = c.grid? `<div class="grid4">${c.grid.map(([t,d])=>`<div><b>${t}</b>${d}</div>`).join("")}</div>`:"";
    return `<article class="card ${pics?"has-pics":""}"><div style="display:grid; gap:12px; align-content:start">
      <header><h3>${c.t}</h3><span class="era">${c.era}</span></header>
      ${c.pts?`<ul>${c.pts.map(p=>`<li>${p}</li>`).join("")}</ul>`:""}${grid}
      ${c.easy?`<p class="easy"><b>쉽게 말하면</b>${c.easy}</p>`:""}</div>${pics}</article>`;
  }).join("");
  const tot = totalBlanks(L);
  const score = st.res? Object.values(st.res).filter(Boolean).length : 0;
  const all = st.res && score===tot;
  return `<section class="screen" data-c="${L.c}" data-lesson="${L.id}">
    <div class="lhead"><span class="k">${L.short} · ${D.UNIT}</span><h1>${L.title}</h1><p>${L.intro}</p>
      <div class="steps"><a href="#read-${L.id}">1. 개념 읽기</a><a href="#vid-${L.id}">2. 영상으로 보기</a><a href="#blank-${L.id}">3. 빈칸 채우기</a><a href="#think-${L.id}">4. 생각 톡톡</a><a href="#more-${L.id}">5. 더 알아보기</a></div></div>
    <div id="read-${L.id}" class="cards">${cards}</div>

    <div id="vid-${L.id}" class="panel" style="display:grid; gap:12px">
      <div class="sec-title"><span class="num" style="background:var(--c)">▶</span><h2 class="sub-h">영상으로 보기</h2></div>
      <p class="muted small">짧은 영상(1~5분)으로 내용을 한 번 더 정리해요. 누르면 유튜브가 새 창으로 열려요.</p>
      <div class="vids">${L.vids.map(v=>`<a class="vid" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener"><div class="th"><img src="thumbs/${v.id}.jpg" alt="" loading="lazy"><i></i><span>${v.len}</span></div><div class="meta"><b>${v.t}</b><small>${v.ch}</small></div></a>`).join("")}</div>
    </div>

    <div id="blank-${L.id}" class="blank-box">
      <div class="hd"><h2>학습지 빈칸 채우기</h2><span class="chip">빈칸 ${tot}개</span>${st.res?`<span class="score">${score} / ${tot}</span>`:""}</div>
      <p class="muted small">읽은 내용을 떠올리며 괄호 안에 알맞은 말을 써요. 띄어쓰기는 틀려도 괜찮아요.</p>
      ${L.blanks.map((b,i)=>blankHTML(L,b,i,st)).join("")}
      <div class="row">
        <button type="button" class="btn" data-check="${L.id}">채점하기</button>
        <button type="button" class="btn ghost" data-reset="${L.id}">다시 풀기</button>
        ${st.res&&!all?`<button type="button" class="btn ghost" data-reveal="${L.id}">정답 보기</button>`:""}
      </div>
      ${all?`<p class="score" style="color:var(--ok)">모두 맞혔어요! ${L.short} 도장을 찍었어요.</p>`:(st.reveal?`<p class="small muted">정답을 확인했다면 ‘다시 풀기’를 눌러 스스로 한 번 더 풀어 보세요. 모두 맞히면 도장을 받아요.</p>`:"")}
    </div>

    <div id="think-${L.id}" class="think">
      <h3>생각 톡톡</h3><p>${L.think.q}</p>
      <textarea id="think-${L.id}-ta" placeholder="내 생각을 자유롭게 써 보세요.">${esc(S["think_"+L.id]||"")}</textarea>
      <div class="row"><button type="button" class="btn ghost small" data-ex="${L.id}">예시 답 보기</button></div>
      <p class="ex" id="ex-${L.id}" hidden>예시 답: ${L.think.ex}</p>
    </div>

    <div id="more-${L.id}">
      <div class="sec-title" style="margin-bottom:12px"><span class="num" style="background:var(--c)">+</span><h2 class="sub-h">더 알아보기</h2></div>
      <div class="links">${L.links.map(k=>`<a class="lk" href="${k.u}" target="_blank" rel="noopener"><span class="src">${k.src}</span><b>${k.t}</b><span>${k.d}</span></a>`).join("")}</div>
    </div>

    <div class="stampbar"><span class="disp" style="font-size:18px">${S.stamps[L.id]?"도장 완료! 다음 코스로 가 볼까요?":"빈칸을 모두 맞히면 도장을 받아요."}</span>
      <button type="button" class="btn" data-go="${["l1","l2","l3","play"][L.n]}">${L.n<3?`다음: 코스 ${["①","②","③"][L.n]}`:"다음: 정리 놀이"} →</button></div>

function playView(){
  if(!S.det.order) S.det.order=shuffle(D.DETECT.map((_,i)=>i));
  if(!S.orderPool) S.orderPool=shuffle(D.ORDER);
  if(!S.matchOpts) S.matchOpts=shuffle(D.PEOPLE.map(p=>p[1]));
  const pick=S.orderPick, orderRes=S.orderChecked?pick.map((p,i)=>p===D.ORDER[i]):null;
  const Dt=S.det; let det;
  if(Dt.done){ det=`<p class="score">결과: ${Dt.score} / ${D.DETECT.length}</p><p>${Dt.score>=7?"대단해요! 사진만 보고도 척척 알아맞혔어요.":"헷갈린 사진은 코스 ①~③에서 다시 살펴봐요."}</p><div class="row"><button class="btn ghost" data-detreset>다시 도전</button></div>`; }
  else{
    const item=D.DETECT[Dt.order[Dt.i]];
    if(!Dt.opts) Dt.opts=shuffle([item.a,...shuffle(D.DETECT.map(x=>x.a).filter(x=>x!==item.a)).slice(0,3)]);
    det=`<div class="progress" aria-hidden="true"><i style="width:${Dt.i/D.DETECT.length*100}%"></i></div>
      <div class="det" data-c="butter">${fig(item.img)}
      <div style="display:grid; gap:10px"><p class="disp" style="font-size:19px">${Dt.i+1}번 사진! ${D.DETECT_Q}</p>
      <div class="opts">${Dt.opts.map(o=>{let c=""; if(Dt.answered){ if(o===item.a)c="ok"; else if(o===Dt.picked)c="no";} return `<button type="button" class="${c}" data-det="${esc(o)}" ${Dt.answered?"disabled":""}>${o}</button>`;}).join("")}</div>
      ${Dt.answered?`<p class="small">${Dt.picked===item.a?"<b style='color:var(--ok)'>정답!</b>":"<b style='color:var(--no)'>아쉬워요.</b> 정답은 "+item.a+"."} ${item.why}</p><button type="button" class="btn small" data-detnext>${Dt.i+1<D.DETECT.length?"다음 사진":"결과 보기"} →</button>`:""}
      </div></div>`;
  }
  const mres=S.matchRes;
  return `<section class="screen" data-c="butter">
    <div class="lhead"><span class="k">코스 ④ · 단원 정리 놀이</span><h1>놀면서 단원 정리하기</h1><p>세 가지 놀이를 모두 성공하면 ‘놀이’ 도장을 받아요. 틀려도 괜찮으니 여러 번 도전해 보세요.</p></div>
    <div class="game">
      <div class="row"><h2>놀이 1. 사건 순서 맞추기</h2>${S.orderDone?'<span class="chip" style="background:var(--ok-bg);color:var(--ok)">성공</span>':""}</div>
      <p class="muted small">먼저 일어난 일부터 차례대로 눌러 보세요.</p>
      <div class="pool">${S.orderPool.map(o=>`<button type="button" data-ord="${esc(o)}" ${pick.includes(o)?"disabled":""}>${o}</button>`).join("")}</div>
      <div class="slots">${pick.length?pick.map((p,i)=>`<span class="${orderRes?(orderRes[i]?"ok":"no"):""}">${p}</span>`).join(""):"<em>여기에 순서대로 놓여요.</em>"}</div>
      <div class="row"><button type="button" class="btn" data-ordcheck ${pick.length<D.ORDER.length?"disabled":""}>확인하기</button><button type="button" class="btn ghost" data-ordreset>다시 하기</button>
      ${orderRes?(S.orderDone?'<span class="score" style="color:var(--ok)">완벽해요!</span>':'<span class="small" style="color:var(--no)">빨간 칸의 순서를 다시 생각해 봐요.</span>'):""}</div>
    </div>
    <div class="game">
      <div class="row"><h2>놀이 2. ${D.DETECT_TITLE}</h2>${Dt.done&&Dt.score>=7?'<span class="chip" style="background:var(--ok-bg);color:var(--ok)">성공</span>':""}</div>
      <p class="muted small">사진을 보고 알맞은 것을 골라요. ${D.DETECT.length}문제 중 7개 이상 맞히면 성공! 사진을 누르면 크게 볼 수 있어요.</p>
      ${det}
    </div>
    <div class="game">
      <div class="row"><h2>놀이 3. 인물 짝 찾기</h2>${S.matchDone?'<span class="chip" style="background:var(--ok-bg);color:var(--ok)">성공</span>':""}</div>
      <p class="muted small">인물과 알맞은 일을 골라 짝을 지어요.</p>
      <div class="match">${D.PEOPLE.map((p,i)=>`<div class="m ${mres?(mres[i]?"ok":"no"):""}"><b>${p[0]}</b>
        <select id="match-${i}" data-mi="${i}" aria-label="${p[0]}이 한 일"><option value="">한 일 고르기</option>${S.matchOpts.map(o=>`<option ${S["m"+i]===o?"selected":""}>${o}</option>`).join("")}</select>
        <span class="mark">${mres?(mres[i]?"○":"✕"):""}</span></div>`).join("")}</div>
      <div class="row"><button type="button" class="btn" data-matchcheck>확인하기</button></div>
    </div>
    <div class="stampbar"><span class="disp" style="font-size:18px">${S.stamps.play?"놀이 도장 완료! 이제 마무리 평가에 도전해요.":"세 놀이를 모두 성공하면 도장을 받아요."}</span><button type="button" class="btn" data-go="final">다음: 마무리 평가 →</button></div>
  </section>`;
}

function finalView(){
  const F=S.final, sub=F&&F.submitted, Q=D.FINAL;
  const qs=Q.map((q,i)=>`<div class="q"><h3><span class="n">${i+1}.</span>${q.q}</h3>
    ${q.o.map((o,j)=>{let c=""; if(sub){ if(j===q.a)c="right"; else if(F.ans[i]===j)c="wrong";} return `<label class="${c}"><input type="radio" name="fq${i}" value="${j}" ${F&&F.ans[i]===j?"checked":""} ${sub?"disabled":""}> <span>${o}</span></label>`;}).join("")}
    ${sub?`<p class="exp">${F.ans[i]===q.a?"○ 정답!":"✕ 다시 보기:"} ${q.e}</p>`:""}</div>`).join("");
  const score=sub?Q.filter((q,i)=>F.ans[i]===q.a).length:0;
  const t=new Date(), ds=`${t.getFullYear()}년 ${t.getMonth()+1}월 ${t.getDate()}일`;
  const cert=sub?`<div class="cert">
      <svg viewBox="0 0 120 140" width="70" height="80" aria-hidden="true"><use href="#seonbi"/></svg>
      <h2>시간 여행 탐험 인증서</h2><p>${D.UNIT} 「${D.UNIT_NAME}」</p>
      <label class="disp" for="certName">탐험가 이름</label>
      <input id="certName" value="${esc(S.name)}" placeholder="이름을 쓰세요" autocomplete="off">
      <p>위 탐험가는 ${D.CERT_RANGE} 시간 여행을 마치고<br>마무리 평가에서 <b style="font-family:var(--display);font-size:22px;color:var(--tang-d)">${score} / ${Q.length}</b>점을 받았기에 이 인증서를 드립니다.</p>
      <div class="big-stamps">${[["l1","코스①"],["l2","코스②"],["l3","코스③"],["play","놀이"],["final","평가"]].map(([k,l])=>`<span class="${S.stamps[k]?"on":""}">${l}<br>${S.stamps[k]?"완료":""}</span>`).join("")}</div>
      <p class="small muted">${ds} · 이 화면을 캡처해서 선생님께 제출하세요.</p></div>`:"";
  return `<section class="screen" data-c="tang">
    <div class="lhead"><span class="k">코스 ⑤ · 마무리 평가</span><h1>${D.UNIT_SHORT} 마무리 평가</h1><p>${Q.length}문제를 모두 풀고 ‘제출하기’를 누르면 바로 채점되고, 틀린 문제는 해설을 볼 수 있어요.</p></div>
    ${qs}
    <div class="row">${sub?`<span class="score">점수: ${score} / ${Q.length}</span><button type="button" class="btn ghost" data-finalreset>다시 풀기</button>`:`<button type="button" class="btn" data-finalsubmit>제출하기</button><span class="small muted" id="finalMsg"></span>`}</div>
    ${sub?`<div class="panel"><h2 style="font-size:22px;margin-bottom:10px">스스로 평가하기</h2><div class="self">${D.SELF.map((s,i)=>`<div class="s"><span>${s}</span><span class="stars" role="group" aria-label="${s}">${[1,2,3].map(n=>`<button type="button" data-star="${i}-${n}" class="${S.self[i]>=n?"on":""}" aria-label="별 ${n}개">★</button>`).join("")}</span></div>`).join("")}</div></div>${cert}`:""}
  </section>`;
}

function afterRender(){
  document.querySelectorAll("[data-lesson] input[data-bk]").forEach(inp=>{
    inp.addEventListener("input",()=>{ const L=inp.closest("[data-lesson]").dataset.lesson; S.blanks[L].vals[inp.dataset.bk]=inp.value; });
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ checkBlanks(inp.closest("[data-lesson]").dataset.lesson); } });
  });
  document.querySelectorAll("textarea[id^=think-]").forEach(t=>t.addEventListener("input",()=>{ S["think_"+t.id.split("-")[1]]=t.value; }));
  document.querySelectorAll("select[data-mi]").forEach(s=>s.addEventListener("change",()=>{ S["m"+s.dataset.mi]=s.value; }));
  const cn=$("#certName"); if(cn) cn.addEventListener("input",()=>S.name=cn.value);
  document.querySelectorAll("input[name^=fq]").forEach(r=>r.addEventListener("change",()=>{ if(!S.final) S.final={ans:{},submitted:false}; S.final.ans[r.name.slice(2)]=+r.value; }));
}
function syncVals(id){ const st=S.blanks[id]; document.querySelectorAll(`[data-lesson="${id}"] input[data-bk]`).forEach(el=>st.vals[el.dataset.bk]=el.value); }
function checkBlanks(id){
  const L=LESSONS.find(l=>l.id===id), st=S.blanks[id]; syncVals(id); st.reveal=false; st.res={};
  L.blanks.forEach((b,i)=>b.ans.forEach((alts,j)=>{ st.res[`${i}-${j}`]=alts.some(a=>norm(a)===norm(st.vals[`${i}-${j}`])); }));
  const vals=Object.values(st.res), ok=vals.filter(Boolean).length, all=ok===vals.length;
  const first=all&&!S.stamps[id]; if(all) S.stamps[id]=true;
  const y=window.scrollY; render(); window.scrollTo(0,y);
  if(first){ renderTop(true,id); toast(`${L.short} 도장 쾅!`); } else if(!all) toast(`${ok}개 맞혔어요. 틀린 빈칸을 다시 채워 봐요!`);
}
function giveStamp(key,msg){ if(S.stamps[key]) return; S.stamps[key]=true; renderTop(true,key); toast(msg); }
function checkPlay(){ if(S.orderDone&&S.detDone&&S.matchDone) giveStamp("play","놀이 도장 쾅! 모든 놀이 성공!"); }

document.addEventListener("click",e=>{
  if(e.target.classList&&e.target.classList.contains("lb")){ $("#overlay").innerHTML=""; return; }
  const t=e.target.closest("button, a"); if(!t) return;
  const d=t.dataset; const keep=()=>{const y=window.scrollY; render(); window.scrollTo(0,y);};
  if(d.go){ go(d.go); return; }
  if(d.zoom){ const m=IMG[d.zoom]; $("#overlay").innerHTML=`<div class="lb" role="dialog" aria-label="사진 크게 보기"><figure><img src="img/${d.zoom}.jpg" alt="${esc(m.cap)}"><figcaption>${m.cap}</figcaption></figure><button class="btn x" data-close>닫기</button></div>`; return; }
  if(d.close!==undefined){ $("#overlay").innerHTML=""; return; }
  if(d.hint!==undefined){ const L=t.closest("[data-lesson]").dataset.lesson; syncVals(L); S.blanks[L].hints[d.hint]=true; keep(); return; }
  if(d.check){ checkBlanks(d.check); return; }
  if(d.reset){ S.blanks[d.reset]={vals:{},res:null,hints:{},reveal:false}; keep(); return; }
  if(d.reveal){ S.blanks[d.reveal].reveal=true; keep(); return; }
  if(d.ex){ const el=$("#ex-"+d.ex); el.hidden=!el.hidden; t.textContent=el.hidden?"예시 답 보기":"예시 답 숨기기"; return; }
  if(d.ord){ if(S.orderPick.length<D.ORDER.length){ S.orderPick.push(d.ord); S.orderChecked=false; } keep(); return; }
  if(d.ordreset!==undefined){ S.orderPick=[]; S.orderChecked=false; S.orderPool=shuffle(D.ORDER); keep(); return; }
  if(d.ordcheck!==undefined){ S.orderChecked=true; if(S.orderPick.every((p,i)=>p===D.ORDER[i])){ S.orderDone=true; toast("순서 완벽!"); checkPlay(); } keep(); return; }
  if(d.det){ const Dt=S.det; Dt.answered=true; Dt.picked=d.det; if(d.det===D.DETECT[Dt.order[Dt.i]].a) Dt.score++; keep(); return; }
  if(d.detnext!==undefined){ const Dt=S.det; Dt.i++; Dt.answered=false; Dt.opts=null; Dt.picked=null; if(Dt.i>=D.DETECT.length){ Dt.done=true; if(Dt.score>=7){ S.detDone=true; checkPlay(); } } keep(); return; }
  if(d.detreset!==undefined){ S.det={i:0,score:0,answered:false,order:shuffle(D.DETECT.map((_,i)=>i)),done:false}; keep(); return; }
  if(d.matchcheck!==undefined){ S.matchRes=D.PEOPLE.map((p,i)=>($("#match-"+i).value===p[1])); if(S.matchRes.every(Boolean)){ S.matchDone=true; toast("인물 짝 찾기 성공!"); checkPlay(); } keep(); return; }
  if(d.finalsubmit!==undefined){ const F=S.final||{ans:{}}; const miss=D.FINAL.map((_,i)=>i).filter(i=>F.ans[i]===undefined); if(miss.length){ $("#finalMsg").textContent=`아직 안 푼 문제: ${miss.map(i=>i+1).join(", ")}번`; return; } F.submitted=true; S.final=F; const sc=D.FINAL.filter((q,i)=>F.ans[i]===q.a).length; const first=!S.stamps.final; S.stamps.final=true; render(); renderTop(first,"final"); toast(`${sc}점! 평가 도장을 받았어요.`); setTimeout(()=>{const c=$(".cert"); if(c) c.scrollIntoView({behavior:"smooth",block:"center"});},300); return; }
  if(d.finalreset!==undefined){ S.final=null; render(); window.scrollTo(0,0); return; }
  if(d.star){ const [i,n]=d.star.split("-").map(Number); S.self[i]=n; keep(); return; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("#overlay").innerHTML=""; });
renderTop(); render();

</script>
